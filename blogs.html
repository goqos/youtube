<script type="text/javascript">
  const blogUrl = "https://xuroni.blogspot.com"; 

  function toggleMenu() {
    const menu = document.getElementById("sideMenu");
    const overlay = document.getElementById("overlay");
    menu.classList.toggle("active");
    overlay.classList.toggle("active");
  }

  function loadPremiumSitemap(json) {
    const entries = json.feed.entry || [];
    const totalPosts = entries.length;
    
    // Total Count Badge update 
    document.getElementById("total-posts-count").innerText = totalPosts;
// Auto Load All Labels in Side Menu
let labels = [];
let labelHtml = "";

for (let i = 0; i < entries.length; i++) {
  if (entries[i].category) {
    entries[i].category.forEach(function(cat) {
      if (!labels.includes(cat.term)) {
        labels.push(cat.term);
      }
    });
  }
}

labels.sort();

for (let i = 0; i < labels.length; i++) {
  labelHtml += `
    <li>
      <a href="${blogUrl}/search/label/${encodeURIComponent(labels[i])}">
       
        ${labels[i]}
      </a>
    </li>
  `;
}

document.querySelector(".menu-links").innerHTML = labelHtml;
    
    let htmlCode = "";
    
    for (let i = 0; i < totalPosts; i++) {
      const entry = entries[i];
      const title = entry.title.$t;
      
      let url = "";
      for (let j = 0; j < entry.link.length; j++) {
        if (entry.link[j].rel === "alternate") {
          url = entry.link[j].href;
          break;
        }
      }
      
      const rawDate = entry.published.$t; 
      const dateObj = new Date(rawDate);
      const options = { year: 'numeric', month: 'short', day: 'numeric' };
      const formattedDate = dateObj.toLocaleDateString('en-US', options);
      
      let firstLabel = "General";
      if (entry.category && entry.category.length > 0) {
        firstLabel = entry.category[0].term;
      }
      
      // LOGIC: Shuruat me sirf pehle 10 posts ko display karega (i < 10) baki sab hide (display: none) rahenge
      const initialDisplay = (i < 5) ? "flex" : "none";
      
      // CHANGES MADE HERE: added onclick event on .sitemap-card div
      htmlCode += `
        <div class="sitemap-card" data-title="${title.toLowerCase()}" style="display: ${initialDisplay};" onclick="window.open('${url}', '_blank');">
          <h3><a href="${url}" target="_blank" title="${title}" onclick="event.stopPropagation();">${title}</a></h3>
          <div class="card-meta">
            <span class="post-date">${formattedDate}</span>
            <span class="post-label" title="Category: ${firstLabel}">${firstLabel}</span>
          </div>
        </div>
      `;
    }
    
    document.getElementById("sitemap-loading").style.display = "none";
    const resultBox = document.getElementById("sitemap-result-box");
    resultBox.innerHTML = htmlCode;
    resultBox.style.display = "grid";
  }

  // Upgraded Live Search Logic
  function searchSitemapPosts() {
    const query = document.getElementById("sitemap-search").value.toLowerCase().trim();
    const cards = document.getElementsByClassName("sitemap-card");
    
    for (let i = 0; i < cards.length; i++) {
      if (query === "") {
        // Agar search box khali hai, toh wapas sirf top 10 posts dikhao
        cards[i].style.display = (i < 5) ? "flex" : "none";
      } else {
        // Agar kuch search ho rha hai, toh pure database (sare posts) me se filter karo
        const postTitle = cards[i].getAttribute("data-title");
        if (postTitle.includes(query)) {
          cards[i].style.display = "flex";
        } else {
          cards[i].style.display = "none";
        }
      }
    }
  }
</script>
